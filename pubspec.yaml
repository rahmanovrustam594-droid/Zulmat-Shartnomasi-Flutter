name: zulmat_shartnomasi
description: Zulmat Shartnomasi - Dark Survival Strategy Game with Day/Night Cycle, Crafting, and Multiple Endings
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Game Engine
  flame: ^1.10.0
  
  # State Management
  provider: ^6.0.0
  
  # Audio
  audioplayers: ^3.0.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  
  # UI & Fonts
  google_fonts: ^6.0.0
  
  # Sensors (optional)
  sensors_plus: ^2.0.0
  
  # Utils
  uuid: ^4.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_linter: ^4.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/images/ui/
    - assets/images/enemy/
    - assets/images/environment/
    - assets/sounds/
    - assets/fonts/

  # Fonts
  fonts:
    - family: Russo
      fonts:
        - asset: assets/fonts/RussoOne-Regular.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
